dependencies = [
  "numpy==2.5.4",
  "pandas==3.0.6",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
  "threadpoolctl==3.7.0",
  "python-dateutil==3.0.0",
  "six==1.17.0",
  "tzdata==2026.5",
  "cloudpickle==3.1.2",
  "narwhals==2.27.1",
  "packaging==26.3",
  "fastapi==0.163.1",
